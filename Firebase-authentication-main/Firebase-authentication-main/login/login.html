<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook – log in or sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
* {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
}

.login-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
    max-width: 980px;
    width: 100%;
}

.brand-section {
    max-width: 500px;
}

.brand-section h1 {
    color: #1877f2;
    font-size: 64px;
    font-weight: bold;
    margin: 0;
    letter-spacing: -2px;
}

.brand-section p {
    font-size: 28px;
    line-height: 32px;
    color: #1c1e21;
    margin-top: 10px;
}

.login-card {
    width: 100%;
    max-width: 396px;
    padding: 20px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
    text-align: center;
}

.form-control {
    min-height: 52px;
    border: 1px solid #ccd0d5;
    border-radius: 6px;
    font-size: 17px;
    padding: 14px 16px;
    margin-bottom: 12px;
}

.form-control:focus {
    border-color: #1877f2;
    box-shadow: 0 0 0 2px #1877f233;
}

.submit-btn {
    width: 100%;
    min-height: 48px;
    border: 0;
    border-radius: 6px;
    color: white;
    background: #1877f2;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 12px;
}

.submit-btn:hover {
    background: #166fe5;
}

.forgot-link {
    color: #1877f2;
    font-size: 14px;
    text-decoration: none;
}

.forgot-link:hover {
    text-decoration: underline;
}

hr {
    border: none;
    border-top: 1px solid #dadde1;
    margin: 20px 0;
}

.create-account-btn {
    background: #42b72a;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: bold;
    padding: 0 16px;
    min-height: 48px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.create-account-btn:hover {
    background: #36a420;
    color: white;
}

@media(max-width: 900px) {
    .login-wrapper {
        flex-direction: column;
        gap: 20px;
    }
    .brand-section {
        text-align: center;
    }
    .brand-section h1 {
        font-size: 48px;
    }
    .brand-section p {
        font-size: 20px;
        line-height: 24px;
    }
}
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand-section">
            <h1>facebook</h1>
            <p>Facebook helps you connect and share with the people in your life.</p>
        </div>

        <main class="login-card">
            <form id="login-form">
                <input type="email" id="login-email" class="form-control" placeholder="Email address or phone number" autocomplete="email" required>
                <input type="password" id="login-password" class="form-control" placeholder="Password" autocomplete="current-password" required>
                <button type="submit" id="login-btn" class="submit-btn">Log In</button>
                
                <a href="#" class="forgot-link">Forgotten password?</a>
                
                <hr>

                <a href="../signup/signup.html" class="create-account-btn">Create new account</a>

                <p id="login-message" class="text-danger small mt-3" role="status"></p>
            </form>
        </main>
    </div>

    <script type="module" src="../index.js"></script>
</body>
</html>
