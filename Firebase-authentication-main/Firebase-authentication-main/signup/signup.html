<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up for Facebook | Facebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    color: #1c1e21;
    background: #f0f2f5;
}

.signup-wrapper {
    width: 100%;
    max-width: 432px;
}

.signup-card {
    width: 100%;
    padding: 16px 16px 24px 16px;
    border-radius: 8px;
    background: white;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
}

.heading {
    border-bottom: 1px solid #dadde1;
    padding-bottom: 10px;
    margin-bottom: 16px;
}

.heading h1 {
    margin: 0;
    font-size: 32px;
    font-weight: bold;
    color: #1c1e21;
}

.heading p {
    margin: 4px 0 0;
    font-size: 15px;
    color: #606770;
}

.form-control {
    width: 100%;
    min-height: 40px;
    padding: 11px;
    border: 1px solid #ccd0d5;
    border-radius: 6px;
    background: #f5f6f7;
    font-size: 15px;
    margin-bottom: 10px;
}

.form-control:focus {
    background: white;
    border-color: #1877f2;
    box-shadow: 0 0 0 2px #1877f233;
}

.submit-btn {
    width: 194px;
    min-height: 36px;
    display: block;
    margin: 20px auto 0 auto;
    border: none;
    border-radius: 6px;
    background: #42b72a;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.submit-btn:hover {
    background: #36a420;
}

.account-prompt {
    text-align: center;
    margin-top: 20px;
}

.login-link {
    color: #1877f2;
    text-decoration: none;
    font-size: 14px;
}

.login-link:hover {
    text-decoration: underline;
}
    </style>
</head>
<body>
    <main class="signup-wrapper">
        <section class="signup-card">
            <header class="heading">
                <h1>Sign Up</h1>
                <p>It's quick and easy.</p>
            </header>

            <form id="register-form">
                <div class="field-group">
                    <input type="text" class="form-control" id="register-name" placeholder="Full name" autocomplete="name" minlength="2" maxlength="80" required>
                </div>

                <div class="field-group">
                    <input type="email" class="form-control" id="register-email" placeholder="Mobile number or email" autocomplete="email" required>
                </div>

                <div class="field-group">
                    <input type="password" class="form-control" id="register-password" placeholder="New password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="submit-btn">Sign Up</button>
            </form>

            <div class="account-prompt">
                <a href="../login/login.html" class="login-link">Already have an account?</a>
            </div>
        </section>
    </main>

    <script type="module" src="../index.js"></script>
</body>
</html>
