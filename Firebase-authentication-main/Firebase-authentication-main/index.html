<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Facebook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
* {
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    padding: 20px;
}

.intro-card {
    width: 100%;
    max-width: 450px;
    padding: 40px;
    text-align: center;
    background: white;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
}

.intro-card h1 {
    color: #1877f2;
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 10px;
}

.description {
    color: #606770;
    font-size: 16px;
    line-height: 22px;
    margin-bottom: 25px;
}

.start-btn {
    width: 100%;
    min-height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 6px;
    background: #1877f2;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-decoration: none;
}

.start-btn:hover {
    background: #166fe5;
    color: white;
}
    </style>
</head>
<body>
    <main class="intro-card">
        <h1>facebook</h1>
        <p class="description">Connect with friends and the world around you on Facebook.</p>
        <a href="./signup/signup.html" class="start-btn">Get Started</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
